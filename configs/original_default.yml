version: 2

chem:
  fp_option:
    type: ph4
    ph4_dim: 840
  rxn_matrix: data/processed/all/matrix_ph4_ultimo.pkl
  fpindex: data/processed/all/fpindex_ph4_ultimo.pkl
  shape_dataset: /itet-stor/sdivita/net_scratch/originale/ChemProjector/chemprojector/data/processed/all/shape_dataset.pkl

data:
  init_stack_weighted_ratio: 0.90
  patch_size: 3

model:
  encoder_type: shape
  encoder:
    patch_size: 3
    d_model: 256
    nhead: 8
    num_layers: 6
    max_seq_length: 3000
  
  decoder:
    d_model: 256
    nhead: 8
    dim_feedforward: 2048
    num_layers: 6
    pe_max_len: 32
    output_norm: false
    fingerprint_dim: ${chem.fp_option.ph4_dim}
    dim_fp_embed_hidden: 256
    num_reaction_classes: 100

  token_head:
    dim_hidden: 512
  reaction_head:
    num_reaction_classes: 100
    dim_hidden: 512
  fingerprint_head:
    d_model: 512
    num_out_fingerprints: 4
    fingerprint_dim: ${chem.fp_option.ph4_dim}
    dim_hidden: 512
    warmup_prob: 0.01

train:
  loss_weights:
    token: 1.0
    reaction: 1.0
    fingerprint: 0.5
  max_iters: 500_000
  val_freq: 5000
  max_grad_norm: 100.0
  optimizer:
    type: adamw
    lr: 3.e-4
    weight_decay: 0
    beta1: 0.9
    beta2: 0.999
  scheduler:
    type: plateau
    factor: 0.6
    patience: 5
    min_lr: 1.e-5
